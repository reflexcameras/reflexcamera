  <title
     id="01-infrared-and-thermal-title">Two ways of seeing bats after dark</title>
  <desc
     id="01-infrared-and-thermal-desc">Near-infrared illumination travels from a lamp to a bat and is reflected to the camera. Thermal imaging detects radiation emitted by the bat without an illuminator.</desc>
